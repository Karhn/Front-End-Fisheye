<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />

    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link href="https://fonts.googleapis.com/css?family=DM+Sans&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

        <link href="css/style.css" rel="stylesheet" type="text/css" />

    <title>Fisheye - photographe</title>
  </head>
  <body>
    <header role="banner">
      <a href="index.html" aria-label="Retour à la page d'acceuil">
        <img src="assets/images/logo.png" class="logo" alt="Fisheye - Retour page d'acceuil" />
      </a>
    </header>
    <main id="main" role="main">
      <section class="photograph-header" aria-label="Présentation du photographe" role="region">
        <button
          class="contact_button"
          type="button"
          data-bs-toggle="modal"
          data-bs-target="#contactModal"
        >
          Contactez-moi
        </button>
      </section>

        <div class="sort-bar" aria-label="Tri de la galerie">
          <label id="sortLabel" class="sort-label"> Trier par : </label>
            <div id="sortDropdown" class="dropdown">
              <button id="sortBtn" class="btn dropdown-toggle fw-bold sort-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-haspopup="listbox" aria-controls="sortMenu" aria-labelledby="sortLabel sortBtn"> Popularité </button>

              <ul id="sortMenu" class="dropdown-menu sort-menu" role="listbox" aria-labelledby="sortLabel">
                <li>
                  <button class="dropdown-item active" type="button" role="option" data-value="popularity">
                    Popularité
                  </button>
                </li>
                <li>
                  <button class="dropdown-item" type="button" role="option" data-value="date">
                    Date
                  </button>
                </li>
                <li>
                  <button class="dropdown-item" type="button" role="option" data-value="title">
                    Titre
                  </button>
                </li>
              </ul>

            </div>
        </div>
    </main>

    <div class="modal fade" id="contactModal" tabindex="-1">
      <div class="modal-dialog" role="document">
        <div class="modal-content contact-card" id="contact-modal">
          <div class="modal-header border-0">
            <h2 class="modal-title" id="contactModalLabel">
              Contactez-moi<br />
              <span id="contactName"></span>
            </h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close Contact form"
            ></button>
          </div>

          <div class="modal-body">
            <form id="contactForm" novalidate>
              <div class="mb-3">
                <label for="firstName" class="form-label">Prénom</label>
                <input id="firstName" name="firstName" type="text" class="form-control" aria-label="Frist name"/>
              </div>

              <div class="mb-3">
                <label for="lastName" class="form-label">Nom</label>
                <input id="lastName" name="lastName" type="text" class="form-control" aria-label="Last name"/>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" name="email" type="text" class="form-control" aria-label="Email"/>
              </div>

              <div class="mb-3">
                <label for="message" class="form-label">Votre message</label>
                <textarea
                  id="message"
                  name="message"
                  rows="6"
                  class="form-control"
                  aria-label="Your message"
                ></textarea>
              </div>

              <button
                type="submit"
                class="contact_button"
                data-bs-dismiss="modal"
                aria-label="Send"
              >
                Envoyer
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="lightboxModal"
      tabindex="-1"
      role="dialog"
      aria-label="lightboxLabel"
      aria-modal="true"
      aria-labelledby="lightboxLabel"
      aria-describedby="lightboxHelp"
    >
      <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content bg-white text-white position-relative">
          <div class="modal-header border-0">
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close dialog"
            ></button>
          </div>

          <div class="modal-body text-center p-0">
            <div class="lb-frame" id="lightboxViewport" tabindex="-1">
              <img id="lightboxImage" class="img-fluid mx-auto" alt="" />
              <video id="lightboxVideo" class="img-fluid mx-auto" hidden controls preaload="metadata"></video>
            </div>
            <h3 class="modal-title" id="lightboxLabel"></h3>
          </div>

          <button
            type="button"
            id="lightboxPreviousBtn"
            class="lb-arrow lb-prev"
            aria-label="Previous image"
          >
            ❮
          </button>
          <button
            type="button"
            id="lightboxNextBtn"
            class="lb-arrow lb-next"
            aria-label="Next image"
          >
            ❯
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/scripts/pages/photographer.js"></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </body>
</html>
